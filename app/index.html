<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drug Classification</title>
  
  <!-- Load the ONNX Runtime WebAssembly Engine -->
  <script src="https://jsdelivr.net"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .description {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 30px;
    }
    .status {
      font-size: 13px;
      margin-bottom: 20px;
      color: #3b82f6;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    label {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    input, select {
      background-color: #111827;
      border: 1px solid #374151;
      color: #ffffff;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #2563eb;
    }
    button {
      grid-column: 1 / -1;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #1f2937;
      color: #4b5563;
      cursor: not-allowed;
      border: 1px solid #374151;
    }
    #result {
      margin-top: 30px;
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 20px;
      display: none;
    }
    .result-text {
      font-size: 16px;
      color: #e5e7eb;
      margin-bottom: 6px;
    }
    .result-text strong {
      color: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Drug Classification</h1>
  <div class="description">Educational ML demonstration using a trained Scikit-learn pipeline, running fully client-side via ONNX Runtime Web.</div>
  <div id="loading-status" class="status">Initializing WebAssembly engine configurations...</div>

  <form id="predict-form" class="grid">
    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age" value="25" required>
    </div>

    <div class="form-group">
      <label for="sex">Sex</label>
      <select id="sex" required>
        <option value="M">M</option>
        <option value="F">F</option>
      </select>
    </div>

    <div class="form-group">
      <label for="bp">Blood Pressure Category</label>
      <select id="bp" required>
        <option value="HIGH">HIGH</option>
        <option value="LOW">LOW</option>
        <option value="NORMAL">NORMAL</option>
      </select>
    </div>

    <div class="form-group">
      <label for="cholesterol">Cholesterol Category</label>
      <select id="cholesterol" required>
        <option value="HIGH">HIGH</option>
        <option value="NORMAL">NORMAL</option>
      </select>
    </div>

    <div class="form-group full-width">
      <label for="na_to_k">Na_to_K Ratio</label>
      <input type="number" id="na_to_k" value="12.0" step="0.001" required>
    </div>

    <button type="submit" id="submit-btn" disabled>Predict</button>
  </form>

  <div id="result">
    <div class="result-text">Predicted Class: <strong id="predicted-class"></strong></div>
    <div class="result-text">Model Confidence: <strong id="confidence"></strong></div>
  </div>
</div>

<script>
  const MODEL_URL = "model/drug_model.onnx";
  let session = null;

  async function loadModel() {
    try {
      session = await ort.InferenceSession.create(MODEL_URL);
      document.getElementById("submit-btn").disabled = false;
      document.getElementById("loading-status").style.display = "none";
    } catch (error) {
      document.getElementById("loading-status").textContent = "Error loading ONNX layers: " + error.message;
      document.getElementById("loading-status").style.color = "#ef4444";
    }
  }

  async function predict(event) {
    event.preventDefault();

    const age = Number(document.getElementById("age").value);
    const sex = document.getElementById("sex").value;
    const bp = document.getElementById("bp").value;
    const cholesterol = document.getElementById("cholesterol").value;
    const naToK = Number(document.getElementById("na_to_k").value);

    const feeds = {
      Age: new ort.Tensor("int64", BigInt64Array.from([BigInt(Math.round(age))])),
      Sex: new ort.Tensor("string", [sex]),
      BP: new ort.Tensor("string", [bp]),
      Cholesterol: new ort.Tensor("string", [cholesterol]),
      Na_to_K: new ort.Tensor("float64", Float64Array.from([naToK])),
    };

    try {
      const output = await session.run(feeds);
      const label = output.label.data[0];
      const probabilities = output.probabilities.data;
      const maxProb = Math.max(...probabilities);

      document.getElementById("predicted-class").textContent = label;
      document.getElementById("confidence").textContent = (maxProb * 100).toFixed(2) + "%";
      document.getElementById("result").style.display = "block";
    } catch (error) {
      alert("Inference calculation failed: " + error.message);
    }
  }

  document.getElementById("predict-form").addEventListener("submit", predict);
  loadModel();
</script>

</body>
</html>
